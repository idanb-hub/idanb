[project]
name = "idanb-labconfig"
version = "0.1.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Install `data` subdirectory under `sys.prefix`.
shared-data = { data = "." }
# Without this, hatch complains that there are no files to ship.
include = ["src"]
