.defs:
  - &debug { level: DEBUG }
  - &info { level: INFO }
  - &warning { level: WARNING }
  - &error { level: ERROR }
  - &critical { level: CRITICAL }
# https://docs.python.org/3/library/logging.config.html#logging-config-dictschema
version: 1
root:
  level: INFO
  handlers: [tempfile]
loggers:
  reacton: *warning # quite noisy
handlers:
  tempfile:
    class: idanb.core.logs.TempFileHandler
    formatter: precise
formatters:
  precise:
    format: "%(levelname)s:%(name)s:%(message)s"
